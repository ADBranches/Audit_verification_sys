<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Member Login</h1>
    <form id="loginForm">
      <input type="text" id="memberId" placeholder="Member ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <pre id="loginResponse"></pre>
  </div>

  <!-- Integrated script for attempts and lockouts -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const memberId = document.getElementById("memberId").value.trim();
      const password = document.getElementById("password").value.trim();
      const responseBox = document.getElementById("loginResponse");

      try {
        const res = await fetch("http://127.0.0.1:8000/member_login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ member_id: memberId, password: password })
        });

        if (!res.ok) {
          const error = await res.json();
          // Show backend detail (attempts remaining or lockout message)
          responseBox.textContent = "❌ " + error.detail;
          return;
        }

        const result = await res.json();
        responseBox.textContent = "✅ " + result.message;

        // Save login state
        sessionStorage.setItem("memberLoggedIn", "true");
        sessionStorage.setItem("memberId", memberId);

        // Set auto logout after 30 minutes
        const logoutTime = Date.now() + (30 * 60 * 1000);
        sessionStorage.setItem("logoutAt", logoutTime);

        window.location.href = "index.html";
      } catch (err) {
        responseBox.textContent = "❌ Error: " + err.message;
      }
    });
  </script>
</body>
</html>
