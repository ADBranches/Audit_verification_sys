<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Member Login</h1>
    <form id="loginForm">
      <input type="text" id="memberId" placeholder="Member ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <pre id="loginResponse"></pre>

    <!-- ✅ Forgot Password trigger -->
    <button id="showForgotPassword" style="margin-top:15px;">Forgot Password?</button>

    <!-- ✅ Hidden Forgot Password form -->
    <form id="forgotPasswordForm" style="display:none; margin-top:10px;">
      <input type="email" id="forgotEmail" placeholder="Enter your email" required>
      <button type="submit">Send Reset Link</button>
    </form>
    <pre id="forgotPasswordResponse"></pre>
  </div>

  <!-- ✅ Load JS after DOM is ready -->
  <script src="member_login.js"></script>
</body>
</html>
